name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x"]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The pi runtime packages are peer dependencies; npm installs them from the
      # registry, so no local Pi installation is needed to run the suites.
      - name: Install dependencies
        run: npm install --ignore-scripts --legacy-peer-deps

      - name: Type check
        run: npm run typecheck

      # Blocking: AGENTS.md defines typecheck + lint:smell + test as the gate.
      # Without this step a `git commit --no-verify` reaches main unlinted.
      - name: Lint (smell gate)
        run: npm run lint:smell

      - name: Test
        run: npm test -- --test-shard=${{ matrix.shard }}/3

      # Dead code is blocking: knip exits 0 on HEAD, and every ignore it needs is
      # recorded with its reason in docs/smell-baseline.md. A new unused file,
      # export or dependency fails the PR.
      - name: Dead code (knip, blocking)
        run: npm run lint:dead

      # Duplication stays advisory: jscpd is informational at --threshold 12.
      - name: Duplication (jscpd, advisory)
        continue-on-error: true
        run: npm run lint:dup
